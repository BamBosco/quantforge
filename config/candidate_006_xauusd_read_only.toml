[broker]
venue = "Dukascopy"

[instrument]
internal_symbol = "XAUUSD"
broker_symbol = "XAUUSD"
timeframe = "M1"
# Broker contract facts (digits, point, contract size, volume bounds, tick
# values, filling modes, and trading constraints) are observed through MT5
# and appended to the Candidate 006 audit. They are deliberately not configured.

[account]
currency = "USD"
demo_only = true

[execution]
order_submission_enabled = false

[logging]
audit_journal_path = "data/candidate_006_xauusd/xauusd_m1_demo.sqlite3"

unresolved_requirements = [
  "maximum_spread_policy",
  "risk_sizing_formula",
  "maximum_position_size",
  "execution_deviation",
  "stop_freeze_levels",
  "trading_session_policy",
]
