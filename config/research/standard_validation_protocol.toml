# Strategy-neutral research protocol. Passing this gate permits only an
# independent confirmation study; it never authorises paper or live trading.
[protocol]
protocol_id = "standard_chronological_validation"
version = "0.1"

[chronological_split]
holdout_fraction = "0.20"

[walk_forward]
training_sessions = 252
validation_sessions = 63
step_sessions = 63

[research_gate]
minimum_completed_trades = 100
require_positive_total_r = true
require_positive_mean_r = true
require_positive_holdout = true
minimum_positive_walk_forward_windows = 2
