[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantforge"
version = "0.1.0"
description = "Risk-first quantitative trading platform foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quantforge"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantforge"]
